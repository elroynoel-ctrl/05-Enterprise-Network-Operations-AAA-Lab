hostname SW2
enable secret <REDACTED_ENABLE_SECRET>
aaa new-model
aaa authentication login SSH-RADIUS group radius local
aaa accounting exec SSH-ACCOUNTING start-stop group radius
ip ssh version 2
ip domain-name careerhq.local
username admin secret <REDACTED_LOCAL_USER_SECRET>
spanning-tree mode pvst
spanning-tree extend system-id
interface FastEthernet0/10
 switchport access vlan 20
 switchport mode access
interface GigabitEthernet0/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,199,999
 switchport mode trunk
interface Vlan199
 ip address 192.168.199.2 255.255.255.0
ip default-gateway 192.168.199.1
logging trap debugging
logging 192.168.99.10
radius-server host 192.168.99.10 auth-port 1645
radius-server key <REDACTED_RADIUS_KEY>
snmp-server community <REDACTED_SNMP_COMMUNITY> RO
line vty 0 4
 login authentication SSH-RADIUS
 accounting exec SSH-ACCOUNTING
 transport input ssh
line vty 5 15
 login authentication SSH-RADIUS
 accounting exec SSH-ACCOUNTING
 transport input ssh
ntp server 192.168.99.10
