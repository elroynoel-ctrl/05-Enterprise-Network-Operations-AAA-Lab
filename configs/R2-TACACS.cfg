hostname R2
enable secret <REDACTED_ENABLE_SECRET>
aaa new-model
aaa authentication login SSH-TACACS group tacacs+ local
aaa authorization exec default group tacacs+ local if-authenticated
aaa accounting exec SSH-TACACS-ACCOUNTING start-stop group tacacs+
ip cef
no ipv6 cef
username admin privilege 15 secret <REDACTED_LOCAL_USER_SECRET>
ip ssh version 2
ip domain-name careerhq.local
interface GigabitEthernet0/0
 description TRUNK_TO_SW2
 no ip address
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip helper-address 192.168.99.10
interface GigabitEthernet0/0.199
 encapsulation dot1Q 199
 ip address 192.168.199.1 255.255.255.0
interface GigabitEthernet0/0.999
 encapsulation dot1Q 999 native
 no ip address
interface GigabitEthernet0/1
 ip address 10.0.12.2 255.255.255.252
ip route 192.168.10.0 255.255.255.0 10.0.12.1
ip route 192.168.99.0 255.255.255.0 10.0.12.1
tacacs-server host 192.168.99.10
tacacs-server key <REDACTED_TACACS_KEY>
snmp-server community <REDACTED_SNMP_COMMUNITY> RO
logging trap debugging
logging 192.168.99.10
line vty 0 4
 login authentication SSH-TACACS
 accounting exec SSH-TACACS-ACCOUNTING
 transport input ssh
ntp server 192.168.99.10
